<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Partes - IllicitSpeed XS</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:transparent;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.stage{
    position:relative;

    width:min(
        100vw,
        calc(100vh * 1.585)
    );

    height:min(
        100vh,
        calc(100vw / 1.585)
    );

    overflow:hidden;

    user-select:none;
}


/* =========================================================
   FICHA GIRADA HACIA LA DERECHA
========================================================= */

.card{
    position:absolute;

    left:50%;
    top:50%;

    width:63.095%;
    height:158.49%;

    transform:
        translate(-50%, -50%)
        rotate(-90deg);

    transform-origin:center;

    overflow:hidden;
}


/* =========================================================
   FONDO
========================================================= */

.background-image{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:fill;

    pointer-events:none;
    user-select:none;

    z-index:1;
}


/* =========================================================
   PIEZA TRANSPARENTE

   El wrapper hace la flotación.
   La imagen interior puede hacer el pulso al tocar.
========================================================= */

.part-float-wrap{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:3;

    pointer-events:none;

    animation:
        floatingPart
        3.2s
        ease-in-out
        infinite;
}


.part-image{
    width:100%;
    height:100%;

    object-fit:fill;

    pointer-events:none;
    user-select:none;

    transform-origin:center;

    filter:
        drop-shadow(
            0 5px 6px rgba(0,0,0,.18)
        );
}


/* Flotación.

   Como toda la tarjeta está rotada -90°,
   el eje X local se percibe como movimiento
   vertical en la interfaz final.
*/

@keyframes floatingPart{

    0%{
        transform:
            translateX(0px);
    }

    50%{
        transform:
            translateX(5px);
    }

    100%{
        transform:
            translateX(0px);
    }

}


/* Pequeña reacción al tocar la pieza */

.part-image.pulse{

    animation:
        partPulse
        .28s
        ease-out;

}


@keyframes partPulse{

    0%{
        transform:scale(1);
        filter:
            drop-shadow(
                0 5px 6px rgba(0,0,0,.18)
            );
    }

    45%{
        transform:scale(1.035);

        filter:
            drop-shadow(
                0 0 10px rgba(255,255,255,.65)
            );
    }

    100%{
        transform:scale(1);

        filter:
            drop-shadow(
                0 5px 6px rgba(0,0,0,.18)
            );
    }

}


/* =========================================================
   ZONAS TÁCTILES
========================================================= */

.tap{
    position:absolute;

    z-index:10;

    border:0;

    background:transparent;

    margin:0;
    padding:0;

    cursor:pointer;
}


/* Flecha izquierda */

.arrow-left{

    left:0%;
    bottom:3%;

    width:22%;
    height:19%;

}


/* Flecha derecha */

.arrow-right{

    right:0%;
    bottom:3%;

    width:22%;
    height:19%;

}


/* Zona central de la pieza */

.part-touch{

    left:20%;
    top:15%;

    width:60%;
    height:45%;

}


/* Historia */

.history-touch{

    left:0%;
    top:34%;

    width:22%;
    height:22%;

}


/* Usos */

.uses-touch{

    right:0%;
    top:34%;

    width:22%;
    height:22%;

}


/* =========================================================
   CANDADO

   Debido al giro -90°, esta posición queda
   visualmente en la zona superior derecha.
========================================================= */

.lock-button{

    position:absolute;

    left:3%;
    top:3%;

    z-index:40;

    width:11%;
    aspect-ratio:1 / 1;

    border:
        2px solid
        rgba(255,255,255,.50);

    border-radius:50%;

    background:
        rgba(0,0,0,.45);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:
        clamp(
            18px,
            4vw,
            38px
        );

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.45),
        inset 0 0 12px
        rgba(255,255,255,.08);

    transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;

    touch-action:manipulation;
}


.lock-button:active{

    transform:scale(.90);

}


.lock-button.locked{

    background:
        rgba(20,80,35,.68);

    box-shadow:
        0 0 10px
        rgba(130,255,160,.75),
        0 0 20px
        rgba(130,255,160,.30);

}


.lock-button.hidden{

    display:none;

}


/* =========================================================
   ESTADO DE FLECHAS BLOQUEADAS
========================================================= */

.arrow-left:disabled,
.arrow-right:disabled{

    pointer-events:none;
    cursor:default;

}


/* =========================================================
   CONTADOR
========================================================= */

.counter{

    position:absolute;

    right:1%;
    top:34%;

    width:20%;
    height:17%;

    z-index:9;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:42px;

    font-weight:900;
    font-style:italic;

    text-shadow:

        0 3px 2px
        rgba(0,0,0,.90),

        0 0 8px
        rgba(255,255,255,.80),

        0 0 16px
        rgba(255,255,255,.35);

    pointer-events:none;

}


.counter.hidden{

    display:none;

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:absolute;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:5%;

    background:
        rgba(0,0,0,.82);

    touch-action:none;

}


.modal.show{

    display:flex;

}


/* =========================================================
   CAJA
========================================================= */

.modal-box{

    position:relative;

    width:92%;
    height:86%;

    max-height:86%;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border-radius:18px;

    border:
        2px solid
        rgba(255,255,255,.28);

    background:

        linear-gradient(
            180deg,
            rgba(40,46,55,.98),
            rgba(12,15,20,.98)
        );

    box-shadow:

        0 12px 35px
        rgba(0,0,0,.70),

        inset 0 0 25px
        rgba(255,255,255,.04);

    color:white;

    touch-action:none;

}


/* =========================================================
   CABECERA
========================================================= */

.modal-top{

    position:relative;

    flex:0 0 auto;

    padding:
        15px
        54px
        10px
        16px;

    border-bottom:
        1px solid
        rgba(255,255,255,.18);

}


/* =========================================================
   TÍTULO
========================================================= */

.modal-title{

    margin:0;

    font-size:
        clamp(
            16px,
            2.2vw,
            24px
        );

    font-weight:900;
    font-style:italic;

    line-height:1.08;

}


/* =========================================================
   DATOS
========================================================= */

.modal-data{

    margin-top:7px;

    color:#d1d8df;

    font-size:
        clamp(
            11px,
            1.5vw,
            15px
        );

    font-weight:700;

    line-height:1.35;

    white-space:pre-line;

}


/* =========================================================
   CERRAR
========================================================= */

.close{

    position:absolute;

    right:9px;
    top:9px;

    width:34px;
    height:34px;

    padding:0;

    border:
        2px solid
        rgba(255,255,255,.40);

    border-radius:50%;

    background:
        rgba(255,255,255,.12);

    color:white;

    font-size:21px;
    font-weight:900;

    line-height:1;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:20;

    touch-action:manipulation;

}


/* =========================================================
   TEXTO
========================================================= */

.modal-text{

    position:relative;

    flex:1 1 0;

    min-height:0;

    padding:
        15px
        16px
        24px;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior:contain;

    touch-action:none;

    /*
       Texto un poco más grande que antes.
       Nunca bajaremos a menos de 8px.
    */

    font-size:
        clamp(
            12px,
            1.7vw,
            16px
        );

    line-height:1.43;

    white-space:pre-line;

    user-select:text;

}


.modal-text::-webkit-scrollbar{

    width:7px;

}


.modal-text::-webkit-scrollbar-track{

    background:
        rgba(255,255,255,.04);

}


.modal-text::-webkit-scrollbar-thumb{

    background:
        rgba(255,255,255,.30);

    border-radius:10px;

}


/* =========================================================
   CELULARES
========================================================= */

@media(max-height:600px){

    .modal{

        padding:4%;

    }


    .modal-box{

        width:94%;
        height:88%;

        max-height:88%;

    }


    .modal-top{

        padding:
            11px
            45px
            7px
            11px;

    }


    .modal-title{

        font-size:15px;

    }


    .modal-data{

        margin-top:5px;

        font-size:10px;

        line-height:1.26;

    }


    .modal-text{

        /*
           Antes estaba en 10.5.
           Ahora subimos un punto.
        */

        font-size:11.5px;

        line-height:1.37;

        padding:
            11px
            12px
            18px;

    }


    .close{

        width:29px;
        height:29px;

        right:7px;
        top:7px;

        font-size:18px;

    }


    .counter{

        font-size:27px;

    }

}


/* Pantallas extremadamente pequeñas */

@media(max-height:430px){

    .modal-top{

        padding:
            8px
            40px
            6px
            10px;

    }


    .modal-title{

        font-size:13px;

    }


    .modal-data{

        font-size:9px;

    }


    .modal-text{

        /*
           En ningún caso baja de 8.
        */

        font-size:10.5px;

        line-height:1.32;

    }


    .close{

        width:26px;
        height:26px;

        font-size:16px;

    }


    .counter{

        font-size:23px;

    }

}


/* =========================================================
   USUARIOS QUE PREFIEREN MENOS ANIMACIÓN
========================================================= */

@media(
    prefers-reduced-motion:
    reduce
){

    .part-float-wrap{

        animation:none;

    }

}

</style>

</head>



<body>


<div
    class="stage"
    id="stage"
>


    <div
        class="card"
        id="card"
    >


        <!-- ===============================================
             FONDO
        ================================================ -->

        <img
            id="backgroundImage"
            class="background-image"
            src="./piezas/F15.png"
            alt=""
        >


        <!-- ===============================================
             PIEZA TRANSPARENTE
        ================================================ -->

        <div
            id="partFloatWrap"
            class="part-float-wrap"
            style="display:none;"
        >

            <img
                id="partImage"
                class="part-image"
                src=""
                alt=""
            >

        </div>


        <!-- ===============================================
             CANDADO
        ================================================ -->

        <button
            id="lockButton"
            class="lock-button hidden"
            aria-label="Fijar pieza"
        >
            🔓
        </button>


        <!-- ===============================================
             FLECHAS
        ================================================ -->

        <button
            id="prev"
            class="tap arrow-left"
            aria-label="Pieza anterior"
        >
        </button>


        <button
            id="next"
            class="tap arrow-right"
            aria-label="Siguiente pieza"
        >
        </button>


        <!-- ===============================================
             INFORMACIÓN
        ================================================ -->

        <button
            id="partInfo"
            class="tap part-touch"
            aria-label="Información de la pieza"
        >
        </button>


        <!-- ===============================================
             HISTORIA
        ================================================ -->

        <button
            id="history"
            class="tap history-touch"
            aria-label="Historia de la pieza"
        >
        </button>


        <!-- ===============================================
             USOS
        ================================================ -->

        <button
            id="uses"
            class="tap uses-touch"
            aria-label="Cambiar usos"
        >
        </button>


        <!-- ===============================================
             CONTADOR
        ================================================ -->

        <div
            id="counter"
            class="counter hidden"
        >
        </div>


        <!-- ===============================================
             MODAL
        ================================================ -->

        <div
            id="modal"
            class="modal"
        >


            <div
                id="modalBox"
                class="modal-box"
            >


                <div
                    class="modal-top"
                >


                    <button
                        id="close"
                        class="close"
                        aria-label="Cerrar"
                    >
                        ×
                    </button>


                    <h2
                        id="modalTitle"
                        class="modal-title"
                    >
                    </h2>


                    <div
                        id="modalData"
                        class="modal-data"
                    >
                    </div>


                </div>


                <div
                    id="modalText"
                    class="modal-text"
                >
                </div>


            </div>


        </div>


    </div>


</div>



<script>

/* =========================================================
   BASE DE DATOS
========================================================= */

const piezas = [


/* =========================================================
   NINGUNA
========================================================= */

{

    id:"ninguna",

    nombre:"NINGUNA",

    fondo:"./piezas/F15.png",

    pieza:null,

    empresa:"",

    precio:"",

    durabilidad:"",

    max:null,

    reglas:"",

    historia:""

},


/* =========================================================
   1. LLANTAS DRIFTING
   F8 + A8
========================================================= */

{

    id:"drifting",

    nombre:"LLANTAS DRIFTING",

    fondo:"./piezas/F8.png",

    pieza:"./piezas/A8.png",

    empresa:"DesertTail",

    precio:"PC 2",

    durabilidad:"4 daños evitados",

    max:4,


    reglas:
`Cuando una curva vaya a causarte daño por haber avanzado más espacios de los permitidos, puedes activar Llantas Drifting.

Debes pagar 1E por cada punto de daño que fueras a recibir.

Si pagas la energía necesaria, evitas por completo ese daño.

Cada punto de daño evitado reduce en 1 la durabilidad de la pieza.

Para activarla debes disponer tanto de la energía como de la durabilidad necesarias para evitar todo el daño.

Cuando haya evitado un total de 4 daños, la pieza se destruye.`,


    historia:
`Esta tecnología fue desarrollada para adaptarse al estilo de conducción de los corredores de DesertTail, quienes suelen mantener velocidades altas y asumir mayores riesgos al entrar en las curvas.

Sus ingenieros crearon un recubrimiento especial para las llantas inspirado en la estructura de las patas de los guepardos.

El material modifica temporalmente la adherencia de la rueda y permite que el vehículo realice un deslizamiento más controlado, distribuyendo las fuerzas laterales antes de que lleguen a los ejes.

Esto permite tomar curvas a velocidades que normalmente provocarían daños graves en la suspensión.

Sin embargo, el recubrimiento se degrada progresivamente con cada maniobra extrema.`

},


/* =========================================================
   2. ÓXIDO NITROSO
   F5 + A5
========================================================= */

{

    id:"nitro",

    nombre:"ÓXIDO NITROSO",

    fondo:"./piezas/F5.png",

    pieza:"./piezas/A5.png",

    empresa:"Lynx Spirit",

    precio:"PC 2",

    durabilidad:"3 usos",

    max:3,


    reglas:
`Durante tu movimiento puedes gastar 2E y 1 uso de Óxido Nitroso para aumentar tu movimiento según la marcha actual.

1.ª y 2.ª marcha: +1 espacio.

3.ª y 4.ª marcha: +2 espacios.

5.ª y 6.ª marcha: +3 espacios.

El movimiento adicional se suma al resultado obtenido con el dado.

Después de completar todo tu movimiento puedes subir opcionalmente 1 marcha.

Esta subida es adicional al cambio realizado al inicio del turno y nunca permite superar la 6.ª marcha.

Después del tercer uso, la pieza se destruye.`,


    historia:
`A pesar de su nombre comercial, el Óxido Nitroso utilizado en las carreras no corresponde exactamente al compuesto conocido antiguamente por los humanos.

Se trata de un gas extraído y refinado en Gradión, preparado para reaccionar directamente con el sistema energético del vehículo.

Durante unos segundos, el compuesto es inyectado en el Tri-Phase Core, provocando una sobreestimulación controlada de su componente mental.

Esta reacción aumenta momentáneamente la actividad del Core y genera un impulso inmediato y controlado en el vehículo.

El piloto puede decidir cuándo utilizarlo, pero el sistema de inyección se deteriora rápidamente con cada activación.`

},


/* =========================================================
   3. LLANTAS TODO TERRENO
   F1 + A1
========================================================= */

{

    id:"todoterreno",

    nombre:"LLANTAS TODO TERRENO",

    fondo:"./piezas/F1.png",

    pieza:"./piezas/A1.png",

    empresa:"IronHorn",

    precio:"PC 2",

    durabilidad:"4 usos",

    max:4,


    reglas:
`Cuando uno o más vehículos impidan que realices un adelantamiento por los espacios normales de la carretera, puedes gastar 1 uso de Llantas Todo Terreno para realizar la maniobra por fuera de la pista.

Durante ese adelantamiento ignoras el daño que recibirías específicamente por salir de la carretera.

La pieza protege únicamente esta maniobra.

No elimina otros efectos especiales provocados por el terreno, el clima o el tramo.

Después del cuarto uso, la pieza se destruye.`,


    historia:
`Las Llantas Todo Terreno no sustituyen las ruedas originales del vehículo.

Son un recubrimiento adaptable, ligero y retráctil instalado sobre las llantas convencionales.

Durante la conducción normal, sus canales permanecen comprimidos para no afectar el desempeño sobre carretera.

Cuando el vehículo entra en superficies más complicadas, el recubrimiento se expande, aumentando el área de contacto y ayudando a absorber los impactos del terreno.

Esta tecnología fue desarrollada por Orion, quien buscaba permitir que un vehículo pudiera abandonar temporalmente la carretera sin castigar innecesariamente su estructura.`

},


/* =========================================================
   4. SENSOR DE IMPULSO
   F2 + A2
========================================================= */

{

    id:"sensor",

    nombre:"SENSOR DE IMPULSO",

    fondo:"./piezas/F2.png",

    pieza:"./piezas/A2.png",

    empresa:"SharkWave",

    precio:"PC 2",

    durabilidad:"Ilimitada",

    max:Infinity,


    reglas:
`Al finalizar tu movimiento, si un vehículo se encuentra a 1 o 2 espacios delante de ti, puedes gastar 1E para activar el Sensor de Impulso.

Avanza hasta quedar inmediatamente detrás de ese vehículo.

Si el dado utilizado durante ese movimiento mostró el símbolo de Rebufo, después de acercarte mediante el Sensor de Impulso puedes utilizar ese Rebufo para rebasarlo.

Si el dado no mostró Rebufo, no puedes pagar energía para generar un Rebufo adicional después de utilizar esta pieza.

La pieza tiene usos ilimitados.`,


    historia:
`El Sensor de Impulso está inspirado en la extraordinaria sensibilidad eléctrica de los tiburones para detectar presas cercanas.

El dispositivo identifica alteraciones electromagnéticas y aerodinámicas producidas por los vehículos que circulan delante.

Cuando localiza un objetivo cercano, analiza la turbulencia dejada a su paso y aprovecha parte de la energía del aire para reducir la resistencia del vehículo equipado.

El resultado es un impulso breve que permite alcanzar rápidamente al corredor que va delante.

Si las condiciones son adecuadas, el piloto puede convertir ese acercamiento en un Rebufo.`

},


/* =========================================================
   5. SOBORNO
   F14 + A14
========================================================= */

{

    id:"soborno",

    nombre:"SOBORNO",

    fondo:"./piezas/F14.png",

    pieza:"./piezas/A14.png",

    empresa:"TuskForce",

    precio:"PC 1",

    durabilidad:"1 uso",

    max:1,


    reglas:
`Cuando una unidad de policía consiga alcanzarte y vaya a aplicar una detención o sanción, puedes gastar 3E para activar Soborno.

La intervención queda completamente cancelada.

La unidad de policía desaparece inmediatamente de la pista y no aplica ninguna sanción a tu vehículo.

Soborno tiene un único uso.

Después de utilizarlo, la pieza se destruye.`,


    historia:
`Oficialmente, esta pieza no existe.

El llamado Soborno es una modificación clandestina que circula por debajo de cuerda entre corredores, mecánicos y algunos técnicos relacionados con TuskForce.

El dispositivo transmite durante unos segundos una autorización fraudulenta al sistema de identificación de los robots policiales.

La unidad interpreta que la persecución ha sido cancelada desde la central y abandona inmediatamente la intervención.

El código solo funciona una vez antes de ser identificado y bloqueado por la red de TuskForce.`

},


/* =========================================================
   6. TURBO
   F6 + A6
========================================================= */

{

    id:"turbo",

    nombre:"TURBO",

    fondo:"./piezas/F6.png",

    pieza:"./piezas/A6.png",

    empresa:"Lupus Dominion",

    precio:"PC 3",

    durabilidad:"Ilimitada",

    max:Infinity,


    reglas:
`Cuando el dado de movimiento muestre el símbolo de llama, Turbo se activa automáticamente.

El bono depende de tu marcha actual.

1.ª y 2.ª marcha: +1 espacio.

3.ª y 4.ª marcha: +2 espacios.

5.ª y 6.ª marcha: +3 espacios.

El movimiento adicional se suma al resultado normal del dado.

Después de completar tu movimiento puedes subir opcionalmente 1 marcha.

Turbo no consume energía y tiene usos ilimitados.`,


    historia:
`El Turbo moderno fue desarrollado por Tim después de la muerte de su esposa.

A diferencia del Óxido Nitroso, este sistema no intenta forzar directamente al Tri-Phase Core.

Tim descubrió que determinados aumentos en la actividad del cubo emocional provocaban respuestas energéticas espontáneas capaces de ser aprovechadas por el vehículo.

El Turbo canaliza esos excedentes cuando aparecen.

Por esta razón es extremadamente potente, pero también impredecible: el conductor no decide exactamente cuándo se activa.

El Core produce el impulso por sí mismo y el Turbo simplemente está preparado para aprovecharlo.`

},


/* =========================================================
   7. FORZAR MARCHA
   F4 + A4
========================================================= */

{

    id:"forzar",

/* =========================================================
   SONIDOS

   No requieren archivos MP3.
   Se crean directamente con Web Audio.
========================================================= */

let audioContext = null;


function obtenerAudio(){

    if(!audioContext){

        audioContext =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    return audioContext;

}



/* Tono básico */

function tono(
    frecuencia,
    duracion,
    volumen,
    tipo,
    retraso = 0
){

    try{

        const ctx =
            obtenerAudio();


        const osc =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        osc.type =
            tipo || "sine";


        osc.frequency.value =
            frecuencia;


        const inicio =
            ctx.currentTime +
            retraso;


        const fin =
            inicio +
            duracion;


        gain.gain.setValueAtTime(
            0.0001,
            inicio
        );


        gain.gain.exponentialRampToValueAtTime(
            volumen,
            inicio + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            fin
        );


        osc.connect(gain);

        gain.connect(
            ctx.destination
        );


        osc.start(inicio);

        osc.stop(fin + 0.02);

    }

    catch(error){

        /* Si un navegador bloquea sonido,
           la interfaz sigue funcionando. */

    }

}



/* Flecha */

function sonidoFlecha(){

    tono(
        440,

    tono(

        .035,

    );

}

/* =========================================================
   MOSTRAR
========================================================= */

function mostrar(){

    const p =
        piezas[actual];


    /* Fondo */

    backgroundImage.src =
        p.fondo;


    /* Pieza */

    if(p.pieza){

        partImage.src =
            p.pieza;


        partImage.alt =
            p.nombre;


        partFloatWrap.style.display =
            "block";

    }

    else{

        partImage.src =
            "";


        partFloatWrap.style.display =
            "none";

    }


    /* Ninguna */

    if(p.max === null){

        counter.textContent =
            "";


        counter.classList.add(
            "hidden"
        );


        lockButton.classList.add(
            "hidden"
        );


        /*
           NINGUNA siempre queda libre.
        */

        bloqueado =
            false;


        actualizarBloqueo();


        return;

    }


    /* Candado */

    lockButton.classList.remove(
        "hidden"
    );


    /* Infinito */

    if(p.max === Infinity){

        counter.textContent =
            "∞";


        counter.classList.remove(
            "hidden"
        );

    }

    else{

        counter.textContent =
            contadores[p.id];


        counter.classList.remove(
            "hidden"
        );

    }


    actualizarBloqueo();

}



/* =========================================================
   ESTADO DEL CANDADO
========================================================= */

function actualizarBloqueo(){

    if(bloqueado){

        lockButton.textContent =
            "🔒";


        lockButton.classList.add(
            "locked"
        );


        lockButton.setAttribute(
            "aria-label",
            "Liberar pieza"
        );


        prev.disabled =
            true;


        next.disabled =
            true;

    }

    else{

        lockButton.textContent =
            "🔓";


        lockButton.classList.remove(
            "locked"
        );


        lockButton.setAttribute(
            "aria-label",
            "Fijar pieza"
        );


        prev.disabled =
            false;


        next.disabled =
            false;

    }

}



/* =========================================================
   CANDADO
========================================================= */

function cambiarCandado(){

    const p =
        piezas[actual];


    if(
        p.id ===
        "ninguna"
    ){

        return;

    }


    bloqueado =
        !bloqueado;


    if(bloqueado){

        sonidoBloquear();

    }

    else{

        sonidoDesbloquear();

    }


    actualizarBloqueo();

}



/* =========================================================
   PIEZA SIGUIENTE
========================================================= */

function siguiente(){

    if(
        bloqueado ||
        modal.classList.contains(
            "show"
        )
    ){

        return;

    }


    actual++;


    if(
        actual >=
        piezas.length
    ){

        actual =
            0;

    }


    /*
       Al cambiar de pieza,
       el nuevo elemento comienza libre.
    */

    bloqueado =
        false;


    mostrar();

}



/* =========================================================
   PIEZA ANTERIOR
========================================================= */

function anterior(){

    if(
        bloqueado ||
        modal.classList.contains(
            "show"
        )
    ){

        return;

    }


    actual--;


    if(actual < 0){

        actual =
            piezas.length - 1;

    }


    bloqueado =
        false;


    mostrar();

}



/* =========================================================
   CONTADOR
========================================================= */

function cambiarUsos(){

    if(
        modal.classList.contains(
            "show"
        )
    ){

        return;

    }


    const p =
        piezas[actual];


    if(
        p.max === null ||
        p.max === Infinity
    ){

        return;

    }


    let valor =
        contadores[p.id];


    if(valor > 0){

        valor--;

    }

    else{

        valor =
            p.max;

    }


    contadores[p.id] =
        valor;


    sonidoContador(
        valor
    );


    mostrar();

}



/* =========================================================
   PULSO DE LA PIEZA
========================================================= */

function animarPieza(){

    if(
        !piezas[actual].pieza

        return;

    }


    partImage.classList.remove(
        "pulse"
    );


    /*
       Fuerza al navegador a reiniciar
       la animación.
    */

    void partImage.offsetWidth;


    partImage.classList.add(
        "pulse"
    );

}

    modalText.scrollTop =

        function(){

                "show"

/* =========================================================
   SCROLL TÁCTIL DEL TEXTO

   Debido a la rotación -90°, aceptamos movimiento
   horizontal o vertical y usamos el eje dominante.
========================================================= */

let textoTouchX =
    0;


let textoTouchY =
    0;


let textoScrollInicial =
    0;



modalText.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length !== 1
        ){

            return;

        }


        const t =
            e.touches[0];


        textoTouchX =
            t.clientX;


        textoTouchY =
            t.clientY;


        textoScrollInicial =
            modalText.scrollTop;


        e.stopPropagation();

    },
    {
        passive:false
    }
);



modalText.addEventListener(
    "touchmove",
    function(e){

        if(
            e.touches.length !== 1
        ){

            return;

        }


        const t =
            e.touches[0];


        const dx =

            t.clientX -
            textoTouchX;


        const dy =

            t.clientY -
            textoTouchY;


        let movimiento;


        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            movimiento =
                dx;

        }

        else{

            movimiento =
                dy;

        }


        modalText.scrollTop =

            textoScrollInicial -
            movimiento;


        e.preventDefault();

        e.stopPropagation();

    },
    {
        passive:false
    }
);



modalText.addEventListener(
    "touchend",
    function(e){

        e.stopPropagation();

    },
    {
        passive:true
    }
);



modalText.addEventListener(
    "touchcancel",
    function(e){

        e.stopPropagation();

    },
    {
        passive:true
    }
);



/* =========================================================
   RUEDA DEL MOUSE / TRACKPAD
========================================================= */

modalText.addEventListener(
    "wheel",
    function(e){

        let movimiento =
            e.deltaY;


        if(
            Math.abs(e.deltaX) >
            Math.abs(e.deltaY)
        ){

            movimiento =
                e.deltaX;

        }


        modalText.scrollTop +=
            movimiento;


        e.preventDefault();

        e.stopPropagation();

    },
    {
        passive:false
    }
);



/* =========================================================
   SWIPE PARA CAMBIAR PIEZA
========================================================= */

let inicioX =
    0;


let inicioY =
    0;



card.addEventListener(
    "touchstart",
    function(e){

        if(
            bloqueado ||
            modal.classList.contains(
                "show"
            )
        ){

            return;

        }


        const t =
            e.changedTouches[0];


        inicioX =
            t.clientX;


        inicioY =
            t.clientY;

    },
    {
        passive:true
    }
);



card.addEventListener(
    "touchend",
    function(e){

        if(
            bloqueado ||
            modal.classList.contains(
                "show"
            )
        ){

            return;

        }


        const t =
            e.changedTouches[0];


        const dx =

            t.clientX -
            inicioX;


        const dy =

            t.clientY -
            inicioY;


        if(
            Math.abs(dy) > 65 &&
            Math.abs(dy) >
            Math.abs(dx)
        ){

            sonidoFlecha();


            if(dy < 0){

                anterior();

            }

            else{

                siguiente();

            }

        }

    },
    {
        passive:true
    }
);



/* =========================================================
   TECLADO EN PC
========================================================= */

document.addEventListener(
    "keydown",
    function(e){


        if(
            modal.classList.contains(
                "show"
            )
        ){

            if(
                e.key ===
                "Escape"
            ){

                cerrarModal();

            }


            if(
                e.key ===
                "ArrowDown"
            ){

                modalText.scrollTop +=
                    60;

            }


            if(
                e.key ===
                "ArrowUp"
            ){

                modalText.scrollTop -=
                    60;

            }


            return;

        }


        if(bloqueado){

            return;

        }


        if(
            e.key ===
            "ArrowRight"
        ){

            sonidoFlecha();

            siguiente();

        }


        if(
            e.key ===
            "ArrowLeft"
        ){

            sonidoFlecha();

            anterior();

        }

    }
);



/* =========================================================
   INICIO
========================================================= */

mostrar();

</script>
